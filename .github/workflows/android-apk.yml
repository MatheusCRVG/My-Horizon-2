name: Gerar APK Android (teste)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-android:
    name: APK Android arm64 (instalavel para teste)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'

    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Selecionar Android NDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          else
            NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            sdkmanager --install 'ndk;27.2.12479018'
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK selecionado: $NDK_DIR"

      - name: Preparar Rust para Android 64-bit
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Inicializar projeto Android Tauri
        run: npm exec tauri -- android init --ci

      - name: Compilar APK de teste
        run: npm exec tauri -- android build --debug --apk --target aarch64 --ci

      - name: Verificar se APK foi gerado
        shell: bash
        run: |
          set -euo pipefail
          find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print | tee /tmp/apk-list.txt
          test -s /tmp/apk-list.txt
          while IFS= read -r apk; do
            unzip -t "$apk" >/dev/null
            echo "APK valido como arquivo ZIP: $apk"
          done < /tmp/apk-list.txt

      - name: Entregar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: My-Horizon-Plus-Android-5.1.0-APK-TESTE
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
