name: Native Windows validation

# Manual only: prepares reviewable artifacts, never publishes a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Check native environment
        run: node scripts/native-doctor.mjs --strict
      - name: Test actual bundled SQLite repository
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib
      - name: Build Windows installer
        run: npm exec tauri -- build --bundles nsis
      - name: Retain unsigned installer for validation
        uses: actions/upload-artifact@v4
        with:
          name: my-horizon-windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Retain dependency resolution for review
        uses: actions/upload-artifact@v4
        with:
          name: my-horizon-native-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
